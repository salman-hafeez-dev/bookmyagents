<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book My Travel Agents</title>
    <meta
      name="description"
      content="Find and book verified travel agents in Pakistan for Umrah, study visas, job visas, domestic tours and international holiday packages."
    />

    <!--
      The hero slide is a CSS background set by React, so the browser cannot
      discover it until the bundle has parsed and mounted. Preloading it here
      starts the download with the very first HTML, which is what moves the
      Largest Contentful Paint.
    -->
    <link rel="preload" as="image" href="/assets/img/hero/hero-1.webp" fetchpriority="high" />

    <!--
      Fonts used to be pulled in by an @import inside main.css, which is
      serially render-blocking: the browser had to fetch and parse our CSS
      before it even learned these existed. Requested here instead, so they
      download in parallel.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Outfit:wght@100..900&display=swap"
    />

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WS5ZX9PL4F"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-WS5ZX9PL4F');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
